name: Build iOS IPA (unsigned)

# Запуск вручную из вкладки Actions или при пуше в main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    # Бесплатная сборочная машина Apple в облаке GitHub.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (without code signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "Runner.app not found!"; exit 1
          fi
          rm -rf Payload workoutlog-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry workoutlog-unsigned.ipa Payload
          ls -lh workoutlog-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: workoutlog-ipa
          path: workoutlog-unsigned.ipa
          if-no-files-found: error
